name: Superstructure Phase 2 structural atlas migration

on:
  push:
    branches:
      - superstructure-atlas-parity

permissions:
  contents: write

jobs:
  phase2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Execute Phase 2 first application
        run: node tools/generated-maps-superstructure-phase-2-atlas.mjs
      - name: Execute Phase 2 idempotence pass
        run: node tools/generated-maps-superstructure-phase-2-atlas.mjs
      - name: Commit regenerated authority bundle
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- exports/generated-maps.bundle.json exports/generated-maps.manifest.json)" ]; then
            echo "Authority bundle already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add exports/generated-maps.bundle.json exports/generated-maps.manifest.json
            git commit -m "Regenerate superstructure atlas references"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
