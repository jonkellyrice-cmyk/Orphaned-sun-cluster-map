name: Enrich orbital metadata

on:
  push:
    paths:
      - 'dev_scripts/enrich-orbital-metadata.py'

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enrich canonical orbital table
        run: python dev_scripts/enrich-orbital-metadata.py
      - name: Commit enriched table
        run: |
          if git diff --quiet -- docs/system-orbital-distances.csv; then
            echo 'No table changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/system-orbital-distances.csv
          git commit -m 'Enrich canonical system object metadata'
          git push
