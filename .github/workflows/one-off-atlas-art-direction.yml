name: One-off atlas art-direction migration

on:
  push:
    branches:
      - atlas-natural-body-art-style

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: atlas-natural-body-art-style
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regenerate frozen atlas packet
        run: node tools/export-atlas-snapshots.mjs
      - name: Validate
        run: |
          npm test
          npm run atlas:snapshot:check
          git diff --check
      - name: Commit regenerated bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exports/generated-maps.bundle.json
          if git diff --cached --quiet; then
            echo "No generated bundle changes to commit."
          else
            git commit -m "Regenerate natural-body atlas art directions"
            git push origin HEAD:atlas-natural-body-art-style
          fi
