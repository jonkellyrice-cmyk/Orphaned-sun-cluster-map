name: Superstructure Phase 3 authority verification

on:
  push:
    branches:
      - superstructure-atlas-parity

permissions:
  contents: read

jobs:
  phase3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Generated Maps authority and handoff contract
        run: node tools/generated-maps-superstructure-phase-3-authority.mjs
