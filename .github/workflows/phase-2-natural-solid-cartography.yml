name: Phase 2 Natural-Solid Cartography Migration

on:
  push:
    branches:
      - phase-2-natural-solid-cartography

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-2-natural-solid-cartography
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair migration bootstrap
        run: node tools/phase-2-bootstrap-fix.mjs
      - name: Repair quality-pass bootstrap
        run: node tools/phase-2-quality-bootstrap-fix.mjs
      - name: Tighten conservative inference and budgets
        run: node tools/phase-2-quality-fix.mjs
      - name: Apply and validate Phase 2
        run: node tools/generated-maps-phase-2-natural-solid-cartography.mjs
      - name: Commit deterministic migration output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts tools tests data/body-operations exports/generated-maps.bundle.json exports/generated-maps.manifest.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Apply Phase 2 natural-solid cartography enrichment"
            git push origin HEAD:phase-2-natural-solid-cartography
          fi
