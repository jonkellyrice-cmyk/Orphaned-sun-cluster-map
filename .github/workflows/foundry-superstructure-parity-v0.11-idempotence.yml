name: Foundry Superstructure Parity v0.11 Idempotence

on:
  push:
    branches:
      - foundry-superstructure-parity-v0.11.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Re-run deterministic parity migration
        run: node tools/foundry-superstructure-parity-v0.11.mjs
      - name: Require a zero-change second pass
        run: git diff --exit-code
