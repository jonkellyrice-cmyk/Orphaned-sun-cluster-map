name: Surface Art Registration Contract Migration

on:
  push:
    branches:
      - feature/jinyara-surface-art-registration-contract
    paths:
      - "tools/patch-surface-art-registration-contract-v1.mjs"
      - ".github/workflows/surface-art-registration-contract-migration.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/jinyara-surface-art-registration-contract
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate one-off patch script
        run: node --check tools/patch-surface-art-registration-contract-v1.mjs
      - name: Apply bounded contract patch
        run: node tools/patch-surface-art-registration-contract-v1.mjs --apply
      - name: Verify patch idempotence
        run: node tools/patch-surface-art-registration-contract-v1.mjs --check
      - name: Run surface-art contract tests
        run: node --test tests/surface-art-registration.test.mjs
      - name: Run full repository tests
        run: npm test
      - name: Verify frozen atlas remains unchanged
        run: npm run atlas:snapshot:check
      - name: Verify bounded diff hygiene
        run: |
          git diff --check
          unexpected="$(git status --porcelain --untracked-files=all | awk '{print $2}' | grep -Ev '^(scripts/surface-art-registration\.mjs|data/surface-art/manifest\.json|docs/surface-art-registration-contract\.md|tests/surface-art-registration\.test\.mjs)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected changed paths:"
            echo "$unexpected"
            exit 1
          fi
      - name: Commit scripted outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/surface-art-registration.mjs \
            data/surface-art/manifest.json \
            docs/surface-art-registration-contract.md \
            tests/surface-art-registration.test.mjs
          git diff --cached --quiet && { echo "No scripted outputs to commit."; exit 0; }
          git commit -m "feat: define surface art promotion registration contract"
          git push origin HEAD:feature/jinyara-surface-art-registration-contract
