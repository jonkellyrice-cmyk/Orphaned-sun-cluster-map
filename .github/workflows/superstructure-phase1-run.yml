name: Superstructure Phase 1 identity canonization

on:
  push:
    branches:
      - superstructure-atlas-parity

permissions:
  contents: write

jobs:
  phase1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize superstructure identities
        run: node tools/generated-maps-superstructure-phase-1-identities.mjs
      - name: Commit deterministic artifact if changed
        shell: bash
        run: |
          if git diff --quiet -- data/superstructure-identities.json; then
            echo "Phase 1 artifact already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/superstructure-identities.json
            git commit -m "Materialize superstructure identity canon"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Verify Phase 1 idempotence contract
        run: node tools/generated-maps-superstructure-phase-1-identities.mjs --check
