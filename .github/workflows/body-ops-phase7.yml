name: Body Operations Phase 7 Gate

on:
  push:
    branches:
      - feature/body-operations-v0.6.0

permissions:
  contents: read

jobs:
  phase7:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Full regression suite
        run: npm test
      - name: Validate operational canon
        run: npm run body-operations:validate
      - name: Verify byte-for-byte determinism
        run: npm run body-operations:check
