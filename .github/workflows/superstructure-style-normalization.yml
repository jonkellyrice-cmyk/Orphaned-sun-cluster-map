name: Superstructure packet style normalization

on:
  push:
    branches:
      - superstructure-atlas-style-normalization

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Execute deterministic packet migration
        run: node tools/generated-maps-superstructure-style-normalization.mjs
      - name: Commit generated authority changes if needed
        shell: bash
        run: |
          set -euo pipefail
          ALLOWED='^( M scripts/atlas-snapshot-v2\.mjs| M exports/generated-maps\.bundle\.json| M exports/generated-maps\.manifest\.json)$'
          STATUS="$(git status --porcelain --untracked-files=no || true)"
          if [ -n "$STATUS" ]; then
            while IFS= read -r line; do
              if ! [[ "$line" =~ $ALLOWED ]]; then
                echo "Unexpected migration change: $line"
                exit 1
              fi
            done <<< "$STATUS"
          fi
          if git diff --quiet -- scripts/atlas-snapshot-v2.mjs exports/generated-maps.bundle.json exports/generated-maps.manifest.json; then
            echo "Migration already current; no commit required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/atlas-snapshot-v2.mjs exports/generated-maps.bundle.json exports/generated-maps.manifest.json
          git commit -m "Normalize superstructure Generated Maps art direction"
          git push origin "HEAD:${GITHUB_REF_NAME}"
