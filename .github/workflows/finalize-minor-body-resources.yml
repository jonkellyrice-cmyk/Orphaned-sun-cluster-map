name: Finalize minor-body resource metadata

on:
  push:
    paths:
      - 'dev_scripts/finalize-minor-body-resources.py'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Finalize planetoid resource metadata
        run: python dev_scripts/finalize-minor-body-resources.py
      - name: Commit canonical table
        run: |
          if git diff --quiet -- docs/system-orbital-distances.csv; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/system-orbital-distances.csv
          git commit -m 'Finalize minor-body resource metadata'
          git push
