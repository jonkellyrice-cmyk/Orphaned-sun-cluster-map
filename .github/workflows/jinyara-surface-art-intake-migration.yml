name: Jinyara Surface Art Intake Migration

on:
  push:
    branches:
      - feature/jinyara-surface-art-intake
    paths:
      - "tools/patch-jinyara-surface-art-intake-v1.mjs"
      - ".github/workflows/jinyara-surface-art-intake-migration.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/jinyara-surface-art-intake
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate one-off patch script
        run: node --check tools/patch-jinyara-surface-art-intake-v1.mjs
      - name: Apply bounded Jinyara intake patch
        run: node tools/patch-jinyara-surface-art-intake-v1.mjs --apply
      - name: Verify patch idempotence
        run: node tools/patch-jinyara-surface-art-intake-v1.mjs --check
      - name: Run Jinyara intake tests
        run: node --test tests/jinyara-surface-art-intake.test.mjs
      - name: Run full repository tests
        run: npm test
      - name: Verify frozen atlas remains unchanged
        run: npm run atlas:snapshot:check
      - name: Verify bounded diff hygiene
        run: |
          git diff --check
          unexpected="$(git status --porcelain --untracked-files=all | awk '{print $2}' | grep -Ev '^(data/surface-art/intake/thebes/jinyara\.json|docs/jinyara-surface-art-intake\.md|tests/jinyara-surface-art-intake\.test\.mjs)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected changed paths:"
            echo "$unexpected"
            exit 1
          fi
      - name: Commit scripted outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/surface-art/intake/thebes/jinyara.json \
            docs/jinyara-surface-art-intake.md \
            tests/jinyara-surface-art-intake.test.mjs
          git diff --cached --quiet && { echo "No scripted outputs to commit."; exit 0; }
          git commit -m "feat: add Jinyara surface art intake and anchor candidates"
          git fetch origin feature/jinyara-surface-art-intake
          git rebase origin/feature/jinyara-surface-art-intake
          git push origin HEAD:feature/jinyara-surface-art-intake
