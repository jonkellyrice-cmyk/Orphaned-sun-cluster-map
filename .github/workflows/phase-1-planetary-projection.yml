name: Phase 1 Planetary Projection Migration

on:
  push:
    branches:
      - phase-1-planetary-projection-repair

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-1-planetary-projection-repair
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply and validate Phase 1
        run: node tools/generated-maps-phase-1-planetary-projection.mjs
      - name: Commit deterministic migration output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/atlas-snapshot.mjs exports/generated-maps.bundle.json exports/generated-maps.manifest.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Apply Phase 1 planetary projection repair"
            git push origin HEAD:phase-1-planetary-projection-repair
          fi
